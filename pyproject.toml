[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nqbt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "databento>=0.48.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "polars>=0.20.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=15.0.0",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
    "matplotlib",
    "rich",
]
ui = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
]

[tool.setuptools.packages.find]
where = ["src"]
